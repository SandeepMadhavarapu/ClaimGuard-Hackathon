name: iOS build and tests

on:
  push:
    branches:
      - feature/claimguard-ios
    paths:
      - 'ios/ClaimGuard/**'
      - 'evidence-review/samples/**'
      - '.github/workflows/claimguard-ios.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode and an available iPhone
        run: |
          xcodebuild -version
          xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; devices=[x for key in sorted(d,reverse=True) if "SimRuntime.iOS" in key for x in d[key] if x.get("isAvailable") and x["name"].startswith("iPhone")]; print("IPHONE_UDID="+devices[0]["udid"])' >> "$GITHUB_ENV"
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/ClaimGuard/ClaimGuard.xcodeproj \
            -scheme ClaimGuard \
            -destination "platform=iOS Simulator,id=$IPHONE_UDID" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO
